# ===========================================
# NOMBRE DE LA APLICACIÓN
# ===========================================
spring.application.name=Supermercado

# ===========================================
# SERVIDOR
# ===========================================
server.port=8080

# ===========================================
# CONFIGURACIÓN DE MYSQL
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=abc123.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# SPRING DATA JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# OPENAPI / SWAGGER
# ===========================================

# Escanea únicamente los controladores REST
springdoc.packages-to-scan=com.supermercado.controller

# Ruta del documento OpenAPI (JSON)
springdoc.api-docs.path=/v3/api-docs

# Ruta de la interfaz Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena las operaciones alfabéticamente
springdoc.swagger-ui.operationsSorter=alpha

# Ordena los controladores (tags) alfabéticamente
springdoc.swagger-ui.tagsSorter=alpha